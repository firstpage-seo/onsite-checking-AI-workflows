name: Test skills

on:
  push:
  pull_request:

jobs:
  onsite-meta-images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/skills/onsite-canonical-meta-images-extraction-multica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .claude/skills/onsite-canonical-meta-images-extraction-multica/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
